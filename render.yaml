services:
  - type: web
    name: bizora-accounting-web
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bizora-accounting-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: bizora-accounting-db
    databaseName: bizora_accounting
    user: bizora_user
